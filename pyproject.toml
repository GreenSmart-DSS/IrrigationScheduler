[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "IrrigationScheduler"
version = "0.1.0"
description = "A lightweight Python framework for daily root-zone water balance and depletion-based irrigation scheduling."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Morteza Khoshsimaie Chenar" }
]
dependencies = [
    "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]